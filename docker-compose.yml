services:
  app:
    # Base file is production-safe: image-ONLY, no build. The EC2 box receives
    # just this file, so it can never try to build (it has no source/Dockerfile)
    # it can only PULL. CI injects APP_IMAGE with the pinned :sha; locally it's
    # unset and falls back to deployer:latest, which docker-compose.override.yml
    # builds from source.
    image: ${APP_IMAGE:-deployer:latest}
    ports:
      - "5000:5000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      # Mount our config + rules into the container's expected config dir.
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    volumes:
      # Persist dashboards/settings across restarts.
      - grafana-data:/var/lib/grafana
      # Provision the datasource + dashboard PROVIDER configs as code, read-only.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # The dashboard JSON itself, into the path the provider scans.
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/grafana-dashboard.json:ro
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  grafana-data:
