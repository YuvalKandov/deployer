name: CI/CD

# WHEN this pipeline runs.
#  - push to main        → the real integration event (and later, the deploy)
#  - pull_request to main → verify a branch BEFORE it merges, so main stays green
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      # Pulls your repo onto the fresh runner. Without this the VM is empty —
      # it does NOT have your code by default.
      - name: Check out code
        uses: actions/checkout@v4

      # Installs Python and caches the pip download dir keyed on the deps file,
      # so repeat runs skip re-downloading wheels.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      # Lint first: it's seconds-fast, so fail on style/bug-smell before
      # spending time running the test suite.
      - name: Lint with Ruff
        run: ruff check app/

      # `python -m pytest` (not bare `pytest`) puts the repo root on sys.path,
      # which is what makes `from app.main import app` resolve.
      - name: Run tests
        run: python -m pytest

  build-and-push:
    name: Build & Push image
    runs-on: ubuntu-latest
    # GATE: this job won't even start unless lint-and-test went green.
    needs: lint-and-test
    # Only publish from main. PR runs validate (job above) but must NOT push
    # images — and PRs from forks can't read secrets anyway.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Authenticates the runner to DockerHub using the encrypted secrets.
      # The action pipes the token via stdin and masks it in logs.
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Buildx is Docker's modern builder — recommended by build-push-action.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds the image from the repo-root Dockerfile and pushes TWO tags:
      #  - :latest         convenient "newest" pointer (moving target)
      #  - :<commit sha>    immutable, traces every image to an exact commit
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/deployer:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/deployer:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    # Only deploy an image that was actually built & pushed.
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    env:
      AWS_DEFAULT_REGION: eu-central-1
      SG_ID: ${{ secrets.EC2_SG_ID }}
    steps:
      # JUST-IN-TIME ACCESS: SSH (22) is locked to the operator's IP, so the
      # runner can't reach it. Find THIS runner's public IP and open 22 to just
      # that /32. Stored in GITHUB_ENV so the revoke step removes the same rule.
      - name: Open SSH for this runner
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "Runner public IP: $RUNNER_IP"
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp --port 22 \
            --cidr "$RUNNER_IP/32"

      # Lay the private key down on the runner with strict perms, and pre-seed
      # the host's public key into known_hosts. In Phase 2 you answered the
      # "unknown host (yes/no)?" prompt by hand — CI has no human to type "yes",
      # so ssh-keyscan trusts-on-first-use and writes known_hosts for us.
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deployer_key
          chmod 600 ~/.ssh/deployer_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      # SSH in and roll the container to the new image, pinned by commit SHA.
      # The image is public on DockerHub, so the box pulls without auth.
      - name: Deploy container
        env:
          HOST: ${{ secrets.EC2_HOST }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/deployer:${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deployer_key "ubuntu@$HOST" "IMAGE='$IMAGE' bash -s" <<'SCRIPT'
          set -euo pipefail
          docker pull "$IMAGE"
          docker rm -f deployer 2>/dev/null || true
          docker run -d --name deployer -p 80:5000 --restart unless-stopped "$IMAGE"
          docker image prune -f
          SCRIPT

      # if: always() — runs even if the deploy failed, so we NEVER leave port 22
      # open. Closing the hole is more important than the deploy succeeding.
      - name: Revoke SSH access
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp --port 22 \
            --cidr "$RUNNER_IP/32" || true
